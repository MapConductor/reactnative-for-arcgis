buildscript {
  repositories {
    google()
    mavenCentral()
    mavenLocal()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:9.2.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.20"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

def loadArcGisApiKey = {
  def properties = new Properties()
  [
    rootProject.file("local.properties"),
    project.file("local.properties"),
  ].findAll { it.exists() }.each { file ->
    file.withInputStream { properties.load(it) }
  }

  return properties.getProperty("ARCGIS_API_KEY")
    ?: rootProject.findProperty("ARCGIS_API_KEY")
    ?: project.findProperty("ARCGIS_API_KEY")
    ?: System.getenv("ARCGIS_API_KEY")
    ?: ""
}

def arcgisApiKey = loadArcGisApiKey()

rootProject.subprojects { subproject ->
  subproject.plugins.withId("com.android.application") {
    subproject.android.defaultConfig {
      def placeholders = manifestPlaceholders
      def existingArcGisApiKey = placeholders["arcgisApiKey"]
      if (existingArcGisApiKey == null || existingArcGisApiKey.toString().isEmpty()) {
        placeholders["arcgisApiKey"] = arcgisApiKey
      }
    }
  }
}

android {
  namespace "com.mapconductor.react.arcgis"

  compileSdk = rootProject.ext.has("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 35

  defaultConfig {
    minSdk = rootProject.ext.has("minSdkVersion") ? rootProject.ext.minSdkVersion : 26
  }

  buildFeatures {
    compose true
  }

  sourceSets {
    main {
      java.srcDirs += ["src/main/java"]
    }
  }
}

repositories {
  mavenLocal()
  google()
  mavenCentral()
  maven { url "https://esri.jfrog.io/artifactory/arcgis" }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation platform("androidx.compose:compose-bom:2025.02.00")
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.foundation:foundation"
  implementation "androidx.lifecycle:lifecycle-process:2.8.7"
  implementation project(":mapconductor_js-sdk-react")
  api("com.mapconductor:core:1.2.0")
  api("com.mapconductor:compose:1.2.0")
  api("com.mapconductor:for-arcgis:1.2.0")
}
